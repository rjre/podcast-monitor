name: Update podcast data

on:
  schedule:
    # Fetch + tag from show notes: cheap, so run it often.
    - cron: "17 6,18 * * *"
    # Transcribe a few more episodes from full audio: slower/heavier CPU
    # work, so it gets its own once-a-day slot.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'schedule' || github.event.schedule == '17 6,18 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline (fetch + tag new episodes)
        run: python3 pipeline/run.py --backfill-days 7
        # Cold-start / historical backfill uses a wider window; see README.
        # 7 days here is deliberately small since this job runs twice daily
        # and only needs to catch episodes published since the last run.

      - name: Commit updated data
        run: |
          git config user.name "podcast-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/episodes.json data/aggregates.json data/state.json
          if git diff --cached --quiet; then
            echo "No new episodes; nothing to commit."
          else
            git commit -m "Update podcast data ($(date -u +%Y-%m-%d))"
            git push
          fi

  transcribe:
    if: github.event_name != 'schedule' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install faster-whisper
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Transcribe a batch of episodes and re-tag from full text
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 pipeline/transcribe.py --limit 60 --model base
        # Uses OpenRouter ASR (pipeline/transcribe_openrouter.py) automatically
        # since OPENROUTER_API_KEY is set above as a repo secret -- ~1-2
        # min/episode instead of local Whisper's 5-9, and negligible cost
        # (~$0.000003/s of audio, ~1 cent for a 60-min episode), so --limit
        # can be much higher than the old local-Whisper-bound value. Falls
        # back to local Whisper automatically if the secret is ever removed.
        # Round-robin across shows (see select_candidates in transcribe.py),
        # so this reaches every active podcast at least once within a few
        # days, then starts on each show's next-shortest episode, and so on.
        # No ANTHROPIC_API_KEY is configured here (by choice, to avoid
        # metered API cost), so tagging always falls back to the free
        # keyword tagger. See "Getting Claude-quality tags for free" in the
        # README for the manual weekly upgrade pass instead. This repo is
        # public, so GitHub Actions minutes on standard runners are free
        # regardless of --limit -- no billing constraint here anymore.

      - name: Commit updated data
        run: |
          git config user.name "podcast-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/episodes.json data/aggregates.json data/transcripts/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Transcribe + re-tag more episodes ($(date -u +%Y-%m-%d))"
            git push
          fi
