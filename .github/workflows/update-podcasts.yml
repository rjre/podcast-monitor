name: Update podcast data

on:
  schedule:
    # Fetch + tag from show notes: cheap, so run it often.
    - cron: "17 6,18 * * *"
    # Transcribe a few more episodes from full audio: slower/heavier CPU
    # work, so it gets its own once-a-day slot.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'schedule' || github.event.schedule == '17 6,18 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline (fetch + tag new episodes)
        run: python3 pipeline/run.py --backfill-days 7
        # Cold-start / historical backfill uses a wider window; see README.
        # 7 days here is deliberately small since this job runs twice daily
        # and only needs to catch episodes published since the last run.

      - name: Commit updated data
        run: |
          git config user.name "podcast-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/episodes.json data/aggregates.json data/state.json
          if git diff --cached --quiet; then
            echo "No new episodes; nothing to commit."
          else
            git commit -m "Update podcast data ($(date -u +%Y-%m-%d))"
            git push
          fi

  transcribe:
    if: github.event_name != 'schedule' || github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install faster-whisper

      - name: Transcribe a batch of episodes and re-tag from full text
        run: python3 pipeline/transcribe.py --limit 15 --model base
        # Round-robin across shows (see select_candidates in transcribe.py),
        # so at 15/day this reaches every one of the ~97 active podcasts at
        # least once within about 7 days, then starts on each show's
        # second-shortest episode, and so on -- rather than exhausting the
        # batch on whichever handful of shows happen to have the shortest
        # episodes. No ANTHROPIC_API_KEY is configured here (by choice, to
        # avoid metered API cost), so this always falls back to the free
        # keyword tagger. See "Getting Claude-quality tags for free" in the
        # README for the manual weekly upgrade pass instead. Tune --limit
        # up/down here: each episode costs a few minutes of Actions compute,
        # which is billed against your plan's monthly allowance since this
        # repo is private -- 15/day runs close to or over GitHub Free's
        # 2,000 min/month private-repo allowance, see README for the
        # current estimate and what happens if you exceed it.

      - name: Commit updated data
        run: |
          git config user.name "podcast-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/episodes.json data/aggregates.json data/transcripts/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Transcribe + re-tag more episodes ($(date -u +%Y-%m-%d))"
            git push
          fi
